name: Get Pescheck access token
description: Exchange OAuth2 client credentials for a (masked) access token.
inputs:
  base_url:
    description: API base URL
    required: true
  client_id:
    description: OAuth2 client id
    required: true
  client_secret:
    description: OAuth2 client secret
    required: true
outputs:
  token:
    description: The OAuth2 access token (masked in logs)
    value: ${{ steps.fetch.outputs.token }}
runs:
  using: composite
  steps:
    - id: fetch
      shell: bash
      env:
        PESCHECK_BASE_URL: ${{ inputs.base_url }}
        PESCHECK_CLIENT_ID: ${{ inputs.client_id }}
        PESCHECK_CLIENT_SECRET: ${{ inputs.client_secret }}
      run: |
        # Pull requests from forks get no secrets: hand back an empty token so the
        # integration tests skip (they do when PESCHECK_ACCESS_TOKEN is empty)
        # instead of failing the run.
        if [ -z "$PESCHECK_CLIENT_ID" ] || [ -z "$PESCHECK_CLIENT_SECRET" ]; then
          echo "::warning::No Pescheck API credentials available; integration tests will be skipped."
          echo "token=" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        TOKEN="$(bash scripts/get-token.sh)"
        echo "::add-mask::$TOKEN"
        echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
