name: Regenerate clients

# Re-fetch the upstream OpenAPI (Swagger) schema, filter it to v2, regenerate all
# 10 clients with openapi-generator, and - if that drifts from what's committed
# (the upstream API changed) - open/update a PULL REQUEST with the regenerated
# spec/ + clients/, then run the same checks any PR gets (build, generated code
# up to date, contract tests against a mock of the new spec). A human merges, so
# you stay in control. Does NOT commit to main directly.
on:
  workflow_dispatch:
  # Let the API repo trigger a regen right after it deploys to staging:
  #   gh api repos/pescheckit/pescheck-clients/dispatches -f event_type=openapi-schema-changed
  repository_dispatch:
    types: [openapi-schema-changed]
  schedule:
    # Daily, one hour BEFORE the daily e2e run (05:00 UTC), so an API change on
    # staging gets a regen PR the same day instead of up to a week of red e2e.
    - cron: "0 4 * * *"

permissions:
  contents: write
  pull-requests: write
  actions: write # dispatch the PR checks on the regen PR (see last step)

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-go@v6
        with:
          go-version: "1.23"
          cache: false

      - name: Install tooling
        run: npm ci

      - name: Fetch + filter + generate
        # Schema source (staging) is defined once, in scripts/fetch-spec.sh.
        run: npm run build

      # The generator writes a go.mod requiring testify but doesn't populate
      # go.sum; complete it so the regenerated Go client actually builds.
      - name: Complete Go go.sum
        run: cd clients/go && go mod tidy

      # Classify the API change (oasdiff): breaking -> new major version.
      # Writes the PR body and picks the label.
      - name: Classify the API change
        id: apidiff
        run: |
          result=$(bash scripts/api-diff.sh "" spec/openapi.v2.yaml "$RUNNER_TEMP/api-changes.md")
          echo "$result" >> "$GITHUB_OUTPUT"
          if [ "$result" = "breaking=true" ]; then
            echo "label=breaking-change" >> "$GITHUB_OUTPUT"
          else
            echo "label=non-breaking" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "The upstream Pescheck OpenAPI schema (staging) changed, so this pull request regenerates \`spec/\` and the 10 clients."
            echo
            cat "$RUNNER_TEMP/api-changes.md"
            echo
            echo "The pull request checks (build, generated code up to date, contract tests) start automatically. Merge once they pass. If a contract test or example needs a fix, push it to this branch and merge promptly: the next regeneration replaces the branch."
          } > "$RUNNER_TEMP/pr-body.md"

      # Opens (or updates) a PR only if spec/ or clients/ actually changed;
      # a no-op when there's no drift. Review the diff and merge to adopt.
      - name: Open PR if the clients drifted
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automated/regenerate-clients
          delete-branch: true
          add-paths: |
            spec
            clients
          commit-message: "chore: regenerate clients from latest OpenAPI schema"
          title: "Regenerate clients from latest OpenAPI schema"
          body-path: ${{ runner.temp }}/pr-body.md
          labels: |
            automated
            codegen
            ${{ steps.apidiff.outputs.label }}

      # Events made with GITHUB_TOKEN (like the push/PR above) do not start other
      # workflows - except workflow_dispatch. So start the checks explicitly; their
      # runs are attached to the PR's head commit and show up on the PR.
      - name: Run the PR checks on the regen PR
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automated/regenerate-clients
        run: |
          for wf in build.yml check-generated.yml contract.yml; do
            gh workflow run "$wf" --ref "$BRANCH"
          done
          echo "Started PR checks on $BRANCH for ${{ steps.cpr.outputs.pull-request-url }}"
