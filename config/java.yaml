generatorName: java
inputSpec: spec/openapi.v2.yaml
outputDir: clients/java
gitHost: github.com
gitUserId: pescheckit
gitRepoId: pescheck-clients
library: okhttp-gson
additionalProperties:
  groupId: io.pescheck
  artifactId: pescheck-client
  artifactVersion: 0.1.0
  invokerPackage: io.pescheck.client
  apiPackage: io.pescheck.client.api
  modelPackage: io.pescheck.client.model
  hideGenerationTimestamp: "true"
  # Accept response fields the client does not know yet. The default (true)
  # makes every model throw on an unknown field, so any new field added to an
  # API response would break all Java integrations. Found by contract/java.
  disallowAdditionalPropertiesIfNotPresent: false
  # One request object per call instead of one argument per parameter, so a new
  # optional API parameter is a new field, not a signature change that breaks
  # every existing call.
  useSingleRequestParameter: true
